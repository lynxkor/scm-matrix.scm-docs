<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础资料 MDM · 原型演示入口</title>
<style>
  /* ===== 设计令牌：与各原型一致（LC Design 基线） ===== */
  :root {
    --bg: #F8F8F8; --panel: #FFFFFF;
    --ink: #0A0E0A; --sub: #3B3E3B; --muted: #9D9F9D;
    --line: #E6E6E5; --line-soft: #F8F7F7;
    --brand: #009100; --brand-hover: #00A800; --brand-dark: #007400;
    --brand-weak: #E9FAEB; --brand-edge: #B7E0B9;
    --blue: #2261DD; --blue-weak: #E9EEF9;
    --yellow: #C8A12B; --yellow-weak: #FAF6EA;
    --shadow: 0 4px 10px rgba(10, 14, 10, .12);
    --radius: 8px; --radius-sm: 4px; --radius-pill: 999px;
    --t-fast: .15s ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { color: var(--sub); background: var(--bg); line-height: 1.5; overflow: hidden;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
         font-size: 14px; }
  button, input { font: inherit; }
  button { cursor: pointer; }

  /* ===== 顶栏 ===== */
  .topbar { height: 60px; flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 16px; padding: 0 16px; position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark { width: 32px; height: 32px; border-radius: var(--radius-sm); display: grid; place-items: center;
                color: #fff; font-weight: 700; font-size: 13px; background: var(--brand); flex-shrink: 0; }
  .brand-t { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .brand-s { font-size: 12px; color: var(--muted); }
  .divider { width: 1px; height: 28px; background: var(--line); flex-shrink: 0; }
  .current { min-width: 0; }
  .current-t { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.25;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .current-m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
         color: var(--sub); background: #fff; display: inline-flex; align-items: center; gap: 6px;
         font-size: 13px; line-height: 1; transition: all var(--t-fast); white-space: nowrap; }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: #fff; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { border-color: var(--line); color: var(--brand); background: var(--line-soft); }

  /* ===== 主体布局 ===== */
  .layout { height: calc(100vh - 60px); display: grid; grid-template-columns: 268px minmax(0, 1fr);
            transition: grid-template-columns .2s ease; }
  .layout.nav-hidden { grid-template-columns: 0 minmax(0, 1fr); }
  .layout.nav-hidden .sidebar { opacity: 0; pointer-events: none; }

  /* ===== 左侧导航 ===== */
  .sidebar { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column;
             min-width: 0; overflow: hidden; opacity: 1; transition: opacity .15s ease; }
  .side-search { padding: 12px 12px 8px; }
  .side-search input { width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--line);
                       border-radius: var(--radius-sm); font-size: 13px; color: var(--ink);
                       background: #fff; outline: none; transition: border-color var(--t-fast); }
  .side-search input:focus { border-color: var(--brand); }
  .side-search input::placeholder { color: var(--muted); }
  .nav { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .nav-group { margin-top: 12px; }
  .nav-group-t { padding: 0 8px 6px; font-size: 12px; color: var(--muted); font-weight: 600;
                 display: flex; align-items: center; justify-content: space-between; }
  .nav-group-t span { font-weight: 400; }
  .nav-item { width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius-sm);
              padding: 9px 10px; display: block; transition: background var(--t-fast); margin-bottom: 2px; }
  .nav-item:hover { background: var(--line-soft); }
  .nav-item.active { background: var(--brand-weak); }
  .nav-row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .nav-name { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .nav-item.active .nav-name { color: var(--brand-dark); }
  .nav-id { font-size: 11px; font-family: "SF Mono", Consolas, monospace; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .nav-desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ver { display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: var(--radius-pill);
         font-size: 10.5px; font-weight: 600; color: var(--brand-dark); background: var(--brand-weak);
         border: 1px solid var(--brand-edge); flex-shrink: 0; }
  .side-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .side-foot b { color: var(--sub); font-weight: 600; }

  /* ===== 预览区 ===== */
  .viewer { min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .viewer-hint { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 7px 12px;
                 background: var(--yellow-weak); border-bottom: 1px solid #EFE3BF; color: #8C6D12; font-size: 12px; }
  .viewer-hint a { color: var(--blue); text-decoration: none; }
  .viewer-hint a:hover { text-decoration: underline; }
  .viewer-hint .close { margin-left: auto; border: 0; background: none; color: #8C6D12; font-size: 15px; line-height: 1; }
  #frameWrap { flex: 1; min-height: 0; background: #fff; position: relative; }
  #frameWrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* ===== 空状态 ===== */
  .empty { display: grid; place-items: center; height: 100%; text-align: center; padding: 24px; }
  .empty h3 { font-size: 14px; color: var(--sub); margin-bottom: 4px; }
  .empty p { font-size: 12.5px; color: var(--muted); }

  /* ===== 窄屏 ===== */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 220px minmax(0, 1fr); }
    .current { display: none; }
    .divider { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">OT</div>
    <div>
      <div class="brand-t">基础资料 MDM · 原型演示</div>
      <div class="brand-s">9 个高保真交互原型 · 单文件离线可运行</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="current">
    <div class="current-t" id="currentTitle">客户主数据</div>
    <div class="current-m" id="currentMeta">PRD-MD-001 · V1.1</div>
  </div>
  <div class="actions">
    <button class="btn" id="btnToggle" title="显示/隐藏左侧导航">☰ 导航</button>
    <button class="btn" id="btnRefresh" title="重新加载当前原型">⟳ 刷新</button>
    <button class="btn" id="btnDoc" title="打开对应 PRD 文档（Markdown）">文档</button>
    <button class="btn primary" id="btnNew" title="在新标签页打开当前原型">新窗口打开</button>
  </div>
</div>

<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-search">
      <input type="text" id="search" placeholder="搜索编号 / 名称 / 说明…" autocomplete="off">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b>演示提示：</b>左侧切换原型，右侧内嵌预览；如需全屏演示请点【新窗口打开】。<br>
      若浏览器拦截本地内嵌预览，请改用新窗口打开。
    </div>
  </aside>

  <section class="viewer">
    <div class="viewer-hint" id="viewerHint">
      <span id="hintText">正在内嵌预览，部分浏览器可能限制本地文件的内嵌，如未显示请使用右上角【新窗口打开】。</span>
      <a href="javascript:;" id="hintOpen">新窗口打开</a>
      <button class="close" id="hintClose" title="关闭提示">✕</button>
    </div>
    <div id="frameWrap"></div>
  </section>
</div>

<script>
/* ================= 原型清单（新增原型后在此追加一行即可） ================= */
const PROTOS = [
  { id:'PRD-MD-001', name:'客户主数据', version:'V1.1', rules:'R-MD02~05、16~17', group:'贸易伙伴',
    file:'PRD-MD-001-客户主数据-原型.html', desc:'客户档案、客户地址、授权租户；增删改查/启用停用/分仓同步/导入导出' },
  { id:'PRD-MD-002', name:'承运商主数据', version:'V1.1', rules:'R-MD18~26', group:'贸易伙伴',
    file:'PRD-MD-002-承运商主数据-原型.html', desc:'承运商档案、结算信息、快递接口配置、授权租户、合同附件' },
  { id:'PRD-MD-004', name:'供应商主数据', version:'V1.0', rules:'R-MD36~41', group:'贸易伙伴',
    file:'PRD-MD-004-供应商主数据-原型.html', desc:'供应商档案、联系方式、地址信息、授权租户' },
  { id:'PRD-MD-005', name:'司机主数据', version:'V1.0', rules:'R-MD42~47', group:'贸易伙伴',
    file:'PRD-MD-005-司机主数据-原型.html', desc:'司机档案、证件信息、所属承运商' },
  { id:'PRD-MD-006', name:'车辆主数据', version:'V1.0', rules:'R-MD48~56', group:'贸易伙伴',
    file:'PRD-MD-006-车辆主数据-原型.html', desc:'车辆档案、VIN/车牌、核定载质量、司机列表与主驾' },
  { id:'PRD-MD-007', name:'地址主数据', version:'V1.1', rules:'R-MD57~65', group:'贸易伙伴',
    file:'PRD-MD-007-地址主数据-原型.html', desc:'地址、联系信息、电子围栏与经纬度自动定位、提货指引、授权租户' },
  { id:'PRD-MD-003', name:'物料主数据', version:'V1.0', rules:'R-MD27~35', group:'商品主数据',
    file:'PRD-MD-003-物料主数据-原型.html', desc:'物料档案、规格净重、包装、SN管理、危险品标识、授权租户' },
  { id:'PRD-MD-009', name:'物料供应商地址映射', version:'V1.0', rules:'R-MD71~74', group:'商品主数据',
    file:'PRD-MD-009-物料供应商地址映射-原型.html', desc:'物料 + 供应商 唯一映射一个取货地址，用于采购带出' },
  { id:'PRD-MD-008', name:'月台主数据', version:'V1.0', rules:'R-MD66~70', group:'仓储资源',
    file:'PRD-MD-008-月台主数据-原型.html', desc:'月台档案、所属地址、可预约时间段明细（星期/时段/容量）' }
];
const GROUPS = ['贸易伙伴', '商品主数据', '仓储资源'];

/* ================= 状态 ================= */
let current = -1;
let keyword = '';

/* ================= 渲染导航 ================= */
function renderNav(){
  const nav = document.getElementById('nav');
  const kw = keyword.trim().toLowerCase();
  let html = '';
  let total = 0;
  GROUPS.forEach(g => {
    const items = PROTOS.map((p, i) => ({ p, i }))
      .filter(x => x.p.group === g)
      .filter(x => !kw || (x.p.id + x.p.name + x.p.desc).toLowerCase().includes(kw));
    if (!items.length) return;
    total += items.length;
    html += `<div class="nav-group">
      <div class="nav-group-t">${g}<span>${items.length}</span></div>
      ${items.map(({ p, i }) => `
        <button class="nav-item ${i === current ? 'active' : ''}" data-idx="${i}" title="${p.id} ${p.name}">
          <div class="nav-row1">
            <span class="nav-name">${p.name}</span>
            <span class="ver">${p.version}</span>
            <span class="nav-id">${p.id.replace('PRD-MD-', 'MD-')}</span>
          </div>
          <div class="nav-desc">${p.desc}</div>
        </button>`).join('')}
    </div>`;
  });
  if (!total) {
    html = `<div class="empty" style="height:auto;padding:40px 12px">
      <div><h3>未找到匹配的原型</h3><p>请调整搜索关键词</p></div></div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(btn =>
    btn.addEventListener('click', () => load(+btn.dataset.idx)));
}

/* ================= 加载原型 ================= */
function load(idx, pushHash){
  const p = PROTOS[idx];
  if (!p) return;
  current = idx;
  document.getElementById('currentTitle').textContent = p.name;
  document.getElementById('currentMeta').textContent = `${p.id} · ${p.version} · ${p.rules}`;
  document.title = `${p.name} · 基础资料 MDM 原型演示`;

  const wrap = document.getElementById('frameWrap');
  wrap.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = p.file;
  f.title = `${p.id} ${p.name}`;
  f.setAttribute('allowfullscreen', 'true');
  wrap.appendChild(f);

  renderNav();
  try { localStorage.setItem('mdm-demo-current', String(idx)); } catch (e) {}
  if (pushHash !== false) {
    try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
  }
}

function currentProto(){
  return PROTOS[current] || null;
}

/* ================= 顶部操作 ================= */
document.getElementById('btnNew').addEventListener('click', () => {
  const p = currentProto(); if (!p) return;
  window.open(encodeURI(p.file), '_blank');
});
document.getElementById('btnRefresh').addEventListener('click', () => {
  if (current < 0) return;
  load(current, false);
});
document.getElementById('btnDoc').addEventListener('click', () => {
  const p = currentProto(); if (!p) return;
  const doc = p.file.replace('-原型.html', '.md');
  window.open(encodeURI(doc), '_blank');
});
document.getElementById('btnToggle').addEventListener('click', () => {
  document.getElementById('layout').classList.toggle('nav-hidden');
});
document.getElementById('hintOpen').addEventListener('click', () => {
  const p = currentProto(); if (p) window.open(encodeURI(p.file), '_blank');
});
document.getElementById('hintClose').addEventListener('click', () => {
  document.getElementById('viewerHint').style.display = 'none';
});
document.getElementById('search').addEventListener('input', function(){
  keyword = this.value;
  renderNav();
});

/* ================= 初始化（支持 #PRD-MD-xxx 深链） ================= */
(function init(){
  let idx = 0;
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (hash) {
    const found = PROTOS.findIndex(p => p.id === hash);
    if (found >= 0) idx = found;
  } else {
    try {
      const saved = parseInt(localStorage.getItem('mdm-demo-current'), 10);
      if (!isNaN(saved) && saved >= 0 && saved < PROTOS.length) idx = saved;
    } catch (e) {}
  }
  load(idx, false);
})();
</script>
</body>
</html>
